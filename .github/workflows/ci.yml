name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest pyyaml
      - name: Run live contract gate (blocks on FAIL)
        run: python pipeline/run_contract_gate.py
      - name: Run contract + metric tests
        run: python -m pytest tests/ -q

# Governance & privacy as code — openFDA drug-safety analytics.
# This policy is the single source of truth; pipeline/apply_governance.py validates that the
# semantic model (model.bim) and the data contract actually enforce what is declared here.
policy_version: "1.0.0"

classification:
  level: "public-deidentified"
  phi: false                       # openFDA FAERS carries no PHI/PII
  pii_columns: []                  # none present
  pii_minimization: "source is already de-identified; no PII columns are landed or modeled"

# Role-based access control. least-privilege by default; admin is the only bronze reader.
rbac:
  roles:
    - name: admin
      model_permission: read
      reads_layer: [bronze, silver, gold]
      rls: none
    - name: analyst
      model_permission: read
      reads_layer: [silver, gold]   # never raw bronze
      rls: none
    - name: restricted_analyst
      model_permission: read
      reads_layer: [gold]
      # row-level security: restricted users see only US reports (RLS filter, enforced in model.bim)
      rls: 'fact_adverse_events[occurcountry] = "US"'

# Retention as code (matches the lifecycle already coded on the AWS leg: S3 30-day expiry).
retention:
  fact_table_days: 365             # mirrors contracts/openfda_fact_contract.json retention_days
  aws_sample_days: 30              # terraform aws_s3_bucket_lifecycle_configuration (healthcare-de-AWS)
  enforcement: "contract retention_days + AWS S3 lifecycle expiry (IaC)"

audit:
  gate_run_log: "proof/gate_run_log.jsonl"     # every contract-gate run is logged
  governance_proof: "proof/governance.json"     # code-generated by apply_governance.py
